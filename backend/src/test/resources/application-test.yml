spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost

app:
  jwt:
    secret: test-secret-key-for-unit-tests-only-min-32-chars!
    expiration-ms: 3600000

logging:
  level:
    org.hibernate.SQL: WARN
